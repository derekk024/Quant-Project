name: 📈 FBK Paper-Trade – Open

on:
  schedule:
    # 09 : 30 ET → 13 : 30 UTC, Monday-Friday
    - cron: '30 13 * * 1-5'
  workflow_dispatch:  # optional manual trigger

jobs:
  open:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ─── install exact versions to avoid NumPy-2 / Alpaca issues ───
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0"
          pip install torch==2.2.1
          pip install alpaca_trade_api==3.3.2
          pip install yfinance pandas

      # ─── run OPEN logic ───
      - name: Place OPEN order
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python paper_trade.py open
