name: FBK-Open
on:
  schedule:
    - cron: '31 13 * * 1-5'
  workflow_dispatch:
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y numpy || true
          python - <<'PY'
import site,glob,shutil,os
for p in glob.glob(os.path.join(site.getsitepackages()[0],"numpy*")):
    shutil.rmtree(p, ignore_errors=True)
PY
          pip install torch==2.2.1
          pip install "numpy<2.0" --force-reinstall --no-cache-dir
          pip install alpaca_trade_api==3.3.2 alpha_vantage==2.3.1
          pip install yfinance pandas
      - name: Open leg
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python paper_trade.py open
