name: 📈 FBK Paper-Trade – Open

on:
  schedule:
    # 09:30 ET → 13:30 UTC, Monday–Friday
    - cron:  '30 13 * * 1-5'

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy torch==2.2.1 alpaca_trade_api

      - name: Place OPEN order
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python paper_trade.py open
